name: shortener dev stack
on:
  push:
    branches: ["main"]
    paths: ["terraform-infra/infra/url-shortener-service/dev/**"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths: ["terraform-infra/infra/url-shortener-service/dev/**"]

jobs:
  plan:
    if: github.event_name == 'pull_request'
    uses: bar-private-org/resuable-workflows/terraform-plan-apply.yml@main
    with:
      { workdir: terraform-infra/infra/url-shortener-service/dev, apply: false }
    secrets: inherit

  apply:
    if: github.event_name == 'push'
    uses: bar-private-org/resuable-workflows/terraform-plan-apply.yml@main
    with:
      { workdir: terraform-infra/infra/url-shortener-service/dev, apply: true }
    secrets: inherit
